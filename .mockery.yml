all: false
dir: "{{.InterfaceDir}}"
filename: mocks_test.go
force-file-write: true
formatter: goimports
formatter-options:
  goimports:
    all-errors: false
    comments: true
    format-only: true
    fragment: false
    local-prefix: ""
    tab-indent: true
    tab-width: 8
generate: true
include-auto-generated: false
log-level: info
structname: "{{.Mock}}{{.InterfaceName}}"
pkgname: "{{.SrcPackageName}}"
recursive: false
require-template-schema-exists: true
template: testify
template-schema: "{{.Template}}.schema.json"
packages:
  github.com/ulibaysya/muzalea/internal/modules/audio/service:
    config:
      all: true
  github.com/ulibaysya/muzalea/internal/modules/mux:
    config:
      all: true
      dir: internal/modules/audio/service
      pkgname: "service"
      filename: "mocks_state_test.go"
  github.com/ulibaysya/muzalea/internal/modules/meta/storage:
    config:
      all: true
